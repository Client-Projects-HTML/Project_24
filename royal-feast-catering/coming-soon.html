<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon | Royal Feast Catering</title>
  <meta name="description" content="Royal Feast's online booking portal is launching soon &mdash; sign up to be notified.">
  <meta name="theme-color" content="#7a1010">
  <link rel="canonical" href="https://royalfeastcatering.example/coming-soon.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Coming Soon | Royal Feast Catering">
  <meta property="og:description" content="Royal Feast's online booking portal is launching soon &mdash; sign up to be notified.">
  <meta property="og:image" content="https://placehold.co/1200x630/7a1010/fbf7f0?text=Royal+Feast+Catering&font=poppins">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%237a1010'/%3E%3Ctext x='50' y='66' font-size='55' text-anchor='middle' fill='%23b8860b' font-family='Georgia'%3ER%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="brand">
        <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg></span>
        <span>Royal <em>Feast</em></span>
      </a>

      <div class="header-actions">
        <button class="icon-btn" data-dir-toggle aria-pressed="false" aria-label="Switch to right-to-left layout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 4 6 4 9s-1.5 6.4-4 9c-2.5-2.6-4-6-4-9s1.5-6.4 4-9z"/></svg></button>
        <button class="icon-btn" data-theme-toggle aria-pressed="false" aria-label="Switch to dark mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg></button>
      </div>
    </div>
  </header>

  <section class="state-page" style="min-height: calc(100vh - var(--header-h)); display: flex; align-items: center; justify-content: center; padding: 24px 0;">
    <div class="container text-center">
      <span class="eyebrow" style="justify-content:center;">Launching Soon</span>
      <h1 style="font-size:clamp(1.8rem,4.5vw,3rem);max-width:680px;margin:0 auto 12px;">Our New Booking Portal Is On Its Way</h1>
      <p style="max-width:540px;margin:0 auto 18px;font-size:1rem;">We're building an online booking &amp; live-menu-builder experience. In the meantime, request a quote and our team will take it from there.</p>

      <div class="countdown" id="countdown" style="margin: 16px 0 24px;">
        <div class="cd-box"><span class="cd-num" id="cd-days">00</span><span class="cd-lbl">Days</span></div>
        <div class="cd-box"><span class="cd-num" id="cd-hours">00</span><span class="cd-lbl">Hours</span></div>
        <div class="cd-box"><span class="cd-num" id="cd-mins">00</span><span class="cd-lbl">Minutes</span></div>
        <div class="cd-box"><span class="cd-num" id="cd-secs">00</span><span class="cd-lbl">Seconds</span></div>
      </div>

      <form class="newsletter-form" style="max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px;align-items:center;">
        <input type="email" placeholder="Your email address" aria-label="Email" required style="width:100%;min-height:48px;border-radius:var(--radius-pill);padding:0 22px;text-align:center;">
        <div style="display:flex;gap:12px;justify-content:center;align-items:center;width:100%;">
          <button type="submit" class="btn btn-primary" style="flex:1;min-height:48px;padding:0 1.6rem;white-space:nowrap;">Notify Me</button>
          <a href="index.html" class="btn btn-secondary" style="flex:1;min-height:48px;padding:0 1.6rem;white-space:nowrap;">Back To Home</a>
        </div>
      </form>
    </div>
  </section>

  <script src="assets/js/main.js"></script>
  <script>
    (function () {
      var target = new Date();
      target.setDate(target.getDate() + 21);
      function tick() {
        var diff = Math.max(0, target - new Date());
        var d = Math.floor(diff / 86400000);
        var h = Math.floor((diff / 3600000) % 24);
        var m = Math.floor((diff / 60000) % 60);
        var s = Math.floor((diff / 1000) % 60);
        var pad = function (n) { return String(n).padStart(2, "0"); };
        var days = document.getElementById("cd-days");
        if (!days) return;
        days.textContent = pad(d);
        document.getElementById("cd-hours").textContent = pad(h);
        document.getElementById("cd-mins").textContent = pad(m);
        document.getElementById("cd-secs").textContent = pad(s);
      }
      tick();
      setInterval(tick, 1000);
    })();
  </script>

</body>
</html>
