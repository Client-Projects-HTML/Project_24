<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Royal Feast</title>
  
  <!-- Make sure this path matches your CSS file name -->
     <link rel="stylesheet" href="assets/css/style.css">

</head>
<body class="login-container">

  <!-- Login Card -->
  <main class="login-card">
    
    <!-- Controls positioned in top-right corner of the card -->
    <div class="page-controls">
      <button type="button" class="icon-btn icon-btn-sm" id="theme-toggle" aria-label="Toggle Dark Mode" title="Toggle Theme">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
      <button type="button" class="btn btn-ghost btn-xs" id="rtl-toggle" title="Toggle RTL Mode">
        RTL
      </button>
    </div>

    <!-- Brand Icon -->
    <div class="brand-mark" style="margin: 0 auto 1.25rem;">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L15 8L22 9L17 14L18.5 21L12 17.5L5.5 21L7 14L2 9L9 8L12 2Z"/></svg>
    </div>
    
    <h2>Welcome Back</h2>
    <p class="subtitle">Please enter your details to sign in.</p>

    <!-- Form -->
    <form class="login-form">
      <div class="form-group">
        <label for="email">Email Address <span class="req">*</span></label>
        <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password <span class="req">*</span></label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Sign In</button>
    </form>

    <div class="admin-redirect">
      Are you an administrator? <a href="admin/index.html">Go to Admin Login &rarr;</a>
    </div>
  </main>

  <!-- Interactive Logic for Theme & RTL Toggles -->
  <script>
    // Dark/Light Theme Toggle
    const themeBtn = document.getElementById('theme-toggle');
    themeBtn.addEventListener('click', () => {
      const html = document.documentElement;
      const currentTheme = html.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
    });

    // RTL Toggle
    const rtlBtn = document.getElementById('rtl-toggle');
    rtlBtn.addEventListener('click', () => {
      const html = document.documentElement;
      const currentDir = html.getAttribute('dir');
      const newDir = currentDir === 'rtl' ? 'ltr' : 'rtl';
      html.setAttribute('dir', newDir);
    });

    // Load saved theme state
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>

</body>
</html>
