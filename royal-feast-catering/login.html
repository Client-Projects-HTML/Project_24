<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Royal Feast Admin</title>
  
  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    .login-card { max-width: 380px !important; padding: 1.25rem 1.5rem !important; }
    .form-group { margin-bottom: 0.85rem !important; }
    .btn { padding: 0.55rem 0.9rem !important; }
  </style>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%237a1010'/%3E%3Ctext x='50' y='66' font-size='55' text-anchor='middle' fill='%23b8860b' font-family='Georgia'%3ER%3C/text%3E%3C/svg%3E">
</head>
<body class="login-container">
  <a href="index.html" class="icon-btn" aria-label="Go to Homepage" title="Go to Homepage" style="position:absolute; top:20px; left:20px; text-decoration:none;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
  </a>

  <!-- Login Card -->
  <main class="login-card">
    
    <!-- Controls positioned in top-right corner of the card -->
    <div class="page-controls">
      <button type="button" class="icon-btn icon-btn-sm" id="theme-toggle" aria-label="Toggle Dark Mode" title="Toggle Theme">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
      <button type="button" class="btn btn-ghost btn-xs" id="rtl-toggle" title="Toggle RTL Mode">
        RTL
      </button>
    </div>

    <!-- Brand Icon -->
    <div class="brand-mark" style="margin: 0 auto 0.4rem; width: 38px; height: 38px;">
      <svg viewBox="0 0 24 24" fill="currentColor" style="width:20px;height:20px;"><path d="M12 2L15 8L22 9L17 14L18.5 21L12 17.5L5.5 21L7 14L2 9L9 8L12 2Z"/></svg>
    </div>
    
    <h2 style="margin-bottom: 2px; font-size: 1.45rem;">Welcome Back</h2>
    <p class="subtitle" style="margin-bottom: 0.85rem; font-size: 0.85rem;">Enter your details to sign in to dashboard.</p>

    <!-- Form -->
    <form class="login-form" id="loginForm">
      <div class="form-group">
        <label for="email" style="font-size: 0.82rem;">Email Address <span class="req">*</span></label>
        <input type="email" id="email" class="form-control" placeholder="admin@royalfeast.com" value="admin@royalfeast.com" required style="min-height: 42px; font-size: 0.9rem;">
      </div>

      <div class="form-group">
        <label for="password" style="font-size: 0.82rem;">Password <span class="req">*</span></label>
        <div class="password-wrapper" style="position: relative;">
          <input type="password" id="password" class="form-control" placeholder="••••••••" value="admin123" required style="padding-right: 40px; min-height: 42px; font-size: 0.9rem;">
          <button type="button" class="password-toggle" aria-label="Toggle password visibility" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--ink-soft);">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div class="form-options" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.85rem; font-size: 0.8rem;">
        <label class="remember-me" style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
          <input type="checkbox" id="remember" checked>
          <span>Remember Me</span>
        </label>
        <a href="#" class="forgot-link" style="color: var(--primary); text-decoration: none; font-weight: 500;">Forgot Password?</a>
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="min-height: 42px; font-size: 0.92rem;">Sign In to Dashboard</button>
      
      <div style="margin-top: 10px;">
        <a href="admin/index.html" class="btn btn-gold btn-block" style="min-height: 40px; font-size: 0.88rem; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none;">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1"/><rect x="13.5" y="3.5" width="7" height="7" rx="1"/><rect x="3.5" y="13.5" width="7" height="7" rx="1"/><rect x="13.5" y="13.5" width="7" height="7" rx="1"/></svg>
          Quick Login to Dashboard &rarr;
        </a>
      </div>

      <div class="signup-redirect" style="text-align: center; margin-top: 0.85rem; font-size: 0.82rem;">
        Don't have an account? <a href="signup.html" style="color: var(--primary); font-weight: 500;">Sign up</a>
      </div>
    </form>
  </main>

  <!-- Interactive Logic for Form & Theme/RTL Toggles -->
  <script>
    // Direct Login Form Submission to Dashboard
    const loginForm = document.getElementById('loginForm');
    if (loginForm) {
      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const submitBtn = loginForm.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        submitBtn.innerHTML = 'Signing in...';
        setTimeout(() => {
          window.location.href = 'admin/index.html';
        }, 350);
      });
    }

    // Dark/Light Theme Toggle
    const themeBtn = document.getElementById('theme-toggle');
    if (themeBtn) {
      themeBtn.addEventListener('click', () => {
        const html = document.documentElement;
        const currentTheme = html.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', newTheme);
        localStorage.setItem('rf-theme', newTheme);
      });
    }

    // RTL Toggle
    const rtlBtn = document.getElementById('rtl-toggle');
    if (rtlBtn) {
      rtlBtn.addEventListener('click', () => {
        const html = document.documentElement;
        const currentDir = html.getAttribute('dir');
        const newDir = currentDir === 'rtl' ? 'ltr' : 'rtl';
        html.setAttribute('dir', newDir);
        localStorage.setItem('rf-dir', newDir);
      });
    }

    // Load saved theme state
    if (localStorage.getItem('rf-theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }

    // Password Toggle
    const togglePassword = document.querySelector('.password-toggle');
    if (togglePassword) {
      togglePassword.addEventListener('click', function (e) {
        const passwordInput = document.getElementById('password');
        const icon = this.querySelector('svg');
        if (passwordInput.type === 'password') {
          passwordInput.type = 'text';
          icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
        } else {
          passwordInput.type = 'password';
          icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
        }
      });
    }
  </script>

</body>
</html>
